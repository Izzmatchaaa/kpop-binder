<!DOCTYPE html>
<html>
<head>
    <title>Riezz's Binder</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>💎 Riezz's Binder</h1>

<button onclick="showStats()">📊 Stats</button>

<div class="form">

    <input id="idol" placeholder="Idol">
    <input id="group" placeholder="Group">
    <input id="era" placeholder="Era">
    <input id="price" placeholder="Price RM">
    <input type="file" id="imageFile">

    <button onclick="addCard()">+ Add Card</button>

</div>

<input id="search" placeholder="Search idol...">

<h3 id="total"></h3>

<div class="binder" id="binder"></div>

<!-- POPUP -->
<div id="popup" class="popup hidden">
    <div class="popup-box">
        <h2>📊 Stats</h2>
        <p id="statsText"></p>
        <button onclick="closeStats()">Close</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
