<!DOCTYPE html>
<html>
<head>
    <title>Kpop Binder App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>💖 K-Pop Photocard Binder</h1>

<!-- SEARCH -->
<input id="search" placeholder="Search idol...">

<!-- FORM ADD CARD -->
<div class="form">

    <input id="idol" placeholder="Idol name">
    <input id="group" placeholder="Group">
    <input id="era" placeholder="Era">
    <input id="price" placeholder="Price RM">
    <input id="image" placeholder="Image URL (images/xxx.jpg)">

<input type="file" id="imageFile">

    <button onclick="addCard()">+ Add Photocard</button>

</div>

<h3 id="total"></h3>

<div class="binder" id="binder"></div>

<script src="script.js"></script>

</body>
</html>
